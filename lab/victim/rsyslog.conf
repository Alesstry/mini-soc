# POR QUÉ rsyslog: sshd escribe a syslog (/dev/log), no directo a un archivo.
# Escribimos los eventos de autenticación a un archivo en un volumen compartido
# que lee el shipper. Template RSYSLOG_FileFormat = timestamp ISO8601 (fácil de parsear).
module(load="imuxsock")

if $syslogfacility-text == 'auth' or $syslogfacility-text == 'authpriv' then {
    action(type="omfile" file="/var/log/lab/auth.log" template="RSYSLOG_FileFormat")
}
